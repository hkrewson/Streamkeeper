services:
  streamkeeper:
    image: ghcr.io/hkrewson/streamkeeper:${STREAMKEEPER_TAG:-latest}
    pull_policy: always
    container_name: streamkeeper
    restart: unless-stopped
    ports:
      - "${STREAMKEEPER_PORT:-8087}:8080"
    environment:
      STREAMKEEPER_DB: /data/streamkeeper.sqlite3
      STREAMKEEPER_USER: ${STREAMKEEPER_USER:-}
      STREAMKEEPER_PASSWORD: ${STREAMKEEPER_PASSWORD:-}
    volumes:
      - ${STREAMKEEPER_DATA_PATH:-/volume1/docker/streamkeeper/data}:/data
      - ${MEDIA_PATH:-/volume1/video}:/media:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
