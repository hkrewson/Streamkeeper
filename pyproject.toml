[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "streamkeeper"
version = "0.1.0"
description = "Read-only Plex media analysis and a parity-gated Apple compatibility planner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=9.1.1,<10",
  "pytest-cov>=5,<7",
  "playwright>=1.50,<2",
]

[project.scripts]
streamkeeper = "streamkeeper.cli:main"
streamkeeper-web = "streamkeeper.web:run"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
streamkeeper = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
